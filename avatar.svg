    <ellipse cx="136" cy="204" rx="13" ry="23" fill="#b97b55"/>
    <ellipse cx="264" cy="204" rx="13" ry="23" fill="#b97b55"/>
    <path d="M136,194 C130,200 131,212 137,218" fill="none" stroke="#97603f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M264,194 C270,200 269,212 263,218" fill="none" stroke="#97603f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- face -->
    <path d="M140,160 C137,212 148,258 176,283 C189,294 211,294 224,283 C252,258 263,212 260,160 C257,118 233,100 200,100 C167,100 143,118 140,160 Z" fill="#c68b63"/>
    <!-- cheek shading -->
    <path d="M140,160 C138,205 148,250 170,276 C158,248 150,212 152,170 Z" fill="#a96f4d" opacity="0.35"/>
    <path d="M260,160 C262,205 252,250 230,276 C242,248 250,212 248,170 Z" fill="#a96f4d" opacity="0.35"/>

    <!-- beard -->
    <path d="M141,200 C141,242 152,266 176,285 C189,295 211,295 224,285 C248,266 259,242 259,200
             L254,212 C252,238 244,256 232,266 C222,262 212,266 200,268 C188,266 178,262 168,266 C156,256 148,238 146,212 Z"
          fill="#2b1d15" opacity="0.45"/>
    <path d="M190,262 C196,266 204,266 210,262 L206,272 C202,274 198,274 194,272 Z" fill="#2b1d15" opacity="0.35"/>
    <!-- mustache -->
    <path d="M180,244 C188,238 196,239 200,241 C204,239 212,238 220,244 C212,243 205,244 200,246 C195,244 188,243 180,244 Z" fill="#2b1d15" opacity="0.5"/>

    <!-- mouth -->
    <path d="M184,251 C192,248 197,249 200,250 C203,249 208,248 216,250 C208,257 192,257 184,251 Z" fill="#96594a"/>
    <path d="M184,251 C193,253.5 207,253.5 216,250" fill="none" stroke="#6e3d32" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M182,250 L185,251.5 M218,248.5 L215,250.5" stroke="#7a4637" stroke-width="1.3" stroke-linecap="round"/>

    <!-- nose -->
