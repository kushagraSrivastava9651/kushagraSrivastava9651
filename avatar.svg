<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Kushagra Srivastava</title>
  <defs>
    <clipPath id="inner"><circle cx="200" cy="200" r="174"/></clipPath>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb15e"/>
      <stop offset="1" stop-color="#f06a1c"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="#ffffff"/>

  <g clip-path="url(#inner)">
    <rect width="400" height="400" fill="#ffffff"/>

    <!-- background swooshes -->
    <path d="M268,48 C350,100 366,236 296,330 C324,236 318,132 268,48 Z" fill="url(#orange)"/>
    <path d="M132,48 C50,100 34,236 104,330 C76,236 82,132 132,48 Z" fill="url(#orange)"/>
    <path d="M246,82 C302,128 310,212 276,282 C288,210 280,140 246,82 Z" fill="#ffd2a3"/>
    <path d="M154,82 C98,128 90,212 124,282 C112,210 120,140 154,82 Z" fill="#ffd2a3"/>

    <g transform="translate(200 214) scale(0.98) translate(-200 -214)"
       stroke="#1d1611" stroke-linejoin="round" stroke-linecap="round">

      <!-- shirt -->
      <path d="M44,440 C50,356 104,330 160,318 L240,318 C296,330 350,356 356,440 Z" fill="#f7f7f4" stroke-width="5"/>
      <path d="M240,318 C290,330 330,350 346,388 L346,440 L300,440 C300,392 286,360 252,336 Z" fill="#e4e4de" stroke="none"/>

      <!-- neck -->
      <path d="M176,256 L224,256 L226,322 L200,350 L174,322 Z" fill="#c8895f" stroke-width="5"/>
      <path d="M176,270 C190,292 210,292 224,270 L225,300 C212,310 188,310 175,300 Z" fill="#a8693f" stroke="none"/>

      <!-- collar -->
      <path d="M168,308 L200,350 L182,372 L148,334 Z" fill="#ffffff" stroke-width="5"/>
      <path d="M232,308 L200,350 L218,372 L252,334 Z" fill="#ffffff" stroke-width="5"/>

      <!-- ears -->
      <path d="M144,190 C128,184 122,200 126,214 C129,226 137,230 146,227" fill="#c8895f" stroke-width="5"/>
      <path d="M256,190 C272,184 278,200 274,214 C271,226 263,230 254,227" fill="#c8895f" stroke-width="5"/>
      <path d="M137,202 C134,208 135,214 139,218" fill="none" stroke-width="3"/>
      <path d="M263,202 C266,208 265,214 261,218" fill="none" stroke-width="3"/>

      <!-- face -->
      <path d="M143,165 C141,215 153,255 177,280 C189,292 211,292 223,280 C247,255 259,215 257,165 C255,123 232,106 200,106 C168,106 145,123 143,165 Z" fill="#d0946a" stroke-width="5"/>
      <!-- single soft shadow side -->
      <path d="M244,140 C256,160 258,212 248,244 C240,264 230,276 222,282 C236,258 246,224 246,186 C246,166 246,152 244,140 Z" fill="#b97a51" stroke="none"/>

      <!-- beard (trimmed, along jaw + chin) -->
      <path d="M144,196 C144,240 156,266 177,282 C189,292 211,292 223,282 C244,266 256,240 256,196
               C253,232 246,252 230,260 C220,262 214,258 200,258 C186,258 180,262 172,258 C154,252 147,232 144,196 Z"
            fill="#4a3526" stroke="none"/>
      <path d="M143,190 C141,236 153,262 177,282 C189,292 211,292 223,282 C247,262 259,236 257,190" fill="none" stroke-width="5"/>
      <!-- mustache -->
      <path d="M183,242 C190,237 196,237 200,239 C204,237 210,237 217,242 C210,243 205,242.5 200,241.5 C195,242.5 190,243 183,242 Z" fill="#4a3526" stroke="none"/>

      <!-- smile -->
      <path d="M186,250 C194,256 206,256 214,250" fill="none" stroke-width="3.5"/>
      <path d="M191,256 C196,259 204,259 209,256" fill="none" stroke="#c98a7a" stroke-width="2.5"/>

      <!-- nose -->
      <path d="M200,204 C199,214 196,221 193,226" fill="none" stroke="#9a5f3c" stroke-width="3"/>
      <path d="M190,228 C195,233 205,233 210,228" fill="none" stroke-width="3.5"/>

      <!-- mole -->
      <circle cx="182" cy="220" r="1.8" fill="#3a2218" stroke="none"/>

      <!-- eyes -->
      <path d="M160,199 C166,190 180,189 188,198 C181,203 167,204 160,199 Z" fill="#ffffff" stroke="none"/>
      <path d="M212,198 C220,189 234,190 240,199 C233,204 219,203 212,198 Z" fill="#ffffff" stroke="none"/>
      <circle cx="175" cy="197" r="6.5" fill="#3a2114" stroke="none"/>
      <circle cx="225" cy="197" r="6.5" fill="#3a2114" stroke="none"/>
      <circle cx="177.5" cy="194.5" r="2.2" fill="#ffffff" stroke="none"/>
      <circle cx="227.5" cy="194.5" r="2.2" fill="#ffffff" stroke="none"/>
      <path d="M158,199 C165,188 181,187 190,197" fill="none" stroke-width="4.5"/>
      <path d="M210,197 C219,187 235,188 242,199" fill="none" stroke-width="4.5"/>

      <!-- eyebrows -->
      <path d="M156,182 C166,174 180,173 191,178" fill="none" stroke="#24170f" stroke-width="8"/>
      <path d="M244,182 C234,174 220,173 209,178" fill="none" stroke="#24170f" stroke-width="8"/>

      <!-- hair -->
      <path d="M141,186 C128,152 128,114 150,92 C168,74 198,66 226,70 C256,74 274,96 274,124
               C275,148 269,168 259,186 C256,166 250,150 239,141 C226,132 210,128 196,129
               C178,131 164,136 155,148 C148,157 144,170 141,186 Z" fill="#2b1c13" stroke-width="5"/>
      <!-- front wave -->
      <path d="M155,147 C160,120 184,102 214,101 C238,101 254,112 260,128 C242,118 220,116 202,119 C182,123 167,132 155,147 Z" fill="#3d2a1d" stroke="none"/>
      <path d="M170,110 C186,93 212,86 236,90" fill="none" stroke="#6e5040" stroke-width="3.5"/>
      <path d="M236,80 C252,86 262,98 266,114" fill="none" stroke="#6e5040" stroke-width="3"/>
    </g>
  </g>

  <!-- ring -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#ffffff" stroke-width="12"/>
  <circle cx="200" cy="200" r="189" fill="none" stroke="#141414" stroke-width="11"/>
</svg>
