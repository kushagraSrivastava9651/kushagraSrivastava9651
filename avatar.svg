    <path d="M188,227 C192,233 197,231 200,233 C203,231 208,233 212,227" fill="none" stroke="#8c5536" stroke-width="2.2" stroke-linecap="round"/>

    <!-- mole -->
    <circle cx="184" cy="219" r="1.3" fill="#4a2c20" opacity="0.85"/>

    <!-- eyes -->
    <path d="M157,197 C164,188 181,187 189,196 C181,202 165,203 157,197 Z" fill="#f4ede6"/>
    <path d="M211,196 C219,187 236,188 243,197 C235,203 219,202 211,196 Z" fill="#f4ede6"/>
    <circle cx="173" cy="195.5" r="6.5" fill="#2a1710"/>
    <circle cx="227" cy="195.5" r="6.5" fill="#2a1710"/>
    <circle cx="175" cy="193.5" r="1.8" fill="#ffffff"/>
    <circle cx="229" cy="193.5" r="1.8" fill="#ffffff"/>
    <path d="M156,197 C164,187 181,186 190,196" fill="none" stroke="#2a1a12" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M210,196 C219,186 236,187 244,197" fill="none" stroke="#2a1a12" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M160,200 C168,204 180,204 187,200" fill="none" stroke="#9c6342" stroke-width="1.4" opacity="0.7"/>
    <path d="M213,200 C220,204 232,204 240,200" fill="none" stroke="#9c6342" stroke-width="1.4" opacity="0.7"/>

    <!-- eyebrows -->
    <path d="M152,182 C163,172 180,171 192,177 L191,183 C180,179 166,180 155,188 Z" fill="#241710"/>
    <path d="M248,182 C237,172 220,171 208,177 L209,183 C220,179 234,180 245,188 Z" fill="#241710"/>

    <!-- hair -->
    <path d="M139,180 C132,152 133,120 154,97 C170,79 196,68 223,71 C250,74 270,93 271,122 C272,145 267,165 261,180
             C259,176 256,160 251,150 C244,140 234,137 221,137 C205,139 190,133 176,137 C163,141 152,152 148,168
             C145,172 142,176 139,180 Z" fill="#231610"/>
    <!-- front volume -->
    <path d="M149,152 C151,120 171,97 205,92 C231,89 252,100 259,120 C241,109 215,107 197,115 C179,122 162,135 149,152 Z" fill="#2f1f16"/>
    <!-- strands -->
    <path d="M166,122 C178,103 199,93 222,91" fill="none" stroke="#4b3527" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
    <path d="M186,116 C201,103 223,98 246,103" fill="none" stroke="#4b3527" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M232,82 C250,86 261,98 265,114" fill="none" stroke="#4b3527" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M172,86 C188,77 206,74 222,76" fill="none" stroke="#3e2b1f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- sideburns -->
    <path d="M140,166 C139,180 140,196 142,206 L147,206 C146,194 146,178 148,166 Z" fill="#231610" opacity="0.55"/>
    <path d="M260,166 C261,180 260,196 258,206 L253,206 C254,194 254,178 252,166 Z" fill="#231610" opacity="0.55"/>
  </g>
</svg>
