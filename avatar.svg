<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Kushagra Srivastava</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="400" height="400" fill="url(#bg)"/>

    <!-- shirt -->
    <path d="M40,400 C48,348 100,326 158,316 L242,316 C300,326 352,348 360,400 Z" fill="#f2f2ee"/>
    <path d="M70,400 C78,362 104,344 132,334" fill="none" stroke="#d9d9d3" stroke-width="3"/>
    <path d="M330,400 C322,362 296,344 268,334" fill="none" stroke="#d9d9d3" stroke-width="3"/>

    <!-- neck -->
    <path d="M175,250 L225,250 L228,322 L200,354 L172,322 Z" fill="#b97b55"/>
    <path d="M175,262 C188,290 212,290 225,262 L226,286 C213,302 187,302 174,286 Z" fill="#9c6342" opacity="0.6"/>

    <!-- collar -->
    <path d="M166,306 L200,354 L180,376 L146,334 Z" fill="#ffffff" stroke="#d4d4ce" stroke-width="2" stroke-linejoin="round"/>
    <path d="M234,306 L200,354 L220,376 L254,334 Z" fill="#ffffff" stroke="#d4d4ce" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="200" cy="384" r="4" fill="#e3e3dd" stroke="#c9c9c2" stroke-width="1.5"/>

